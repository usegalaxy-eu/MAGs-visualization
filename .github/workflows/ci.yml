name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests
        run: pytest

      - name: Check that docs/cli.md matches the CLI
        run: python scripts/build_docs.py --check

      - name: Build the plot gallery (end-to-end run of every subcommand)
        run: python -u scripts/build_docs.py

      - name: Upload gallery
        uses: actions/upload-artifact@v4
        with:
          name: gallery-py${{ matrix.python-version }}
          path: docs
